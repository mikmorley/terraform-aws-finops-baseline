name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on the self-hosted runner (Linux, X64). It has to have curl and tar.
jobs:
  terraform:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5" # oldest supported; module claims >= 1.7
          # The wrapper is a Node script run with the first `node` on PATH. The self-hosted
          # runner's system Node is too old for it, and nothing here reads its outputs.
          terraform_wrapper: false
      # Without a cache every `terraform init` downloads its own copy of the AWS provider
      # (several hundred MB). Ten directories filled the self-hosted runner's disk.
      - name: Share one provider download between directories
        run: |
          mkdir -p "$RUNNER_TEMP/tf-plugin-cache" "$RUNNER_TEMP/tmp"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"
          # Terraform unpacks each provider download into the system temp directory first.
          # /tmp on the self-hosted runner filled up with the partial files that failed
          # installs left behind, so use the job's own temp directory and clear the old ones.
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          rm -f /tmp/terraform-provider* || true
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init and validate (root, modules, examples)
        run: scripts/validate-all.sh
      - uses: terraform-linters/setup-tflint@v6
      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive
      - name: Terraform tests
        # One process per test file. A single `terraform test` for all files was killed
        # (exit 137, out of memory) on the self-hosted runner.
        run: |
          free -m || true
          terraform init -backend=false -input=false
          status=0
          for file in tests/*.tftest.hcl; do
            echo "==> $file"
            terraform test -filter="$file" || status=1
          done
          exit "$status"

  python:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: pip install pytest "moto[ssm,sns,ec2,rds,ce]" boto3 ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pytest
        run: pytest

  checkov:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install checkov
        run: pip install checkov
      - name: Checkov
        # Skips are documented inline next to the resource with a reason.
        run: checkov -d . --framework terraform --quiet --compact

  docs:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      # The terraform-docs/gh-actions image bundles an older terraform-docs whose
      # table layout differs from local runs, so install a pinned version instead.
      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: v0.24.0
        run: |
          curl -sSfLo terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf terraform-docs.tar.gz terraform-docs
          # A user directory on PATH, so the job needs no sudo on a self-hosted runner.
          mkdir -p "$RUNNER_TEMP/bin"
          mv terraform-docs "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rm terraform-docs.tar.gz
      - name: terraform-docs drift check
        run: |
          terraform-docs --config .terraform-docs.yml .
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::READMEs are out of date, run terraform-docs"; exit 1; }
