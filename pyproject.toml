[tool.ruff]
line-length = 100
target-version = "py313"
src = ["lambda"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"lambda/tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["lambda/tests"]
pythonpath = ["lambda"]
addopts = "-ra --strict-markers"
